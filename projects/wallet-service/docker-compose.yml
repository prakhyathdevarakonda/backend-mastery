services:
  postgres:
    image: postgres:17-alpine
    container_name: wallet-service-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wallet_service
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_service"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wallet_postgres_data:
